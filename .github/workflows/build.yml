name: Build

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  # En PRs solo se valida: corre tests y buildea la imagen, sin publicarla.
  pull_request:
    branches: [main]

jobs:
  # 1) Tests (unitarios + integración contra PostgreSQL) con coverage
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peliculas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # config.php lee estas variables de entorno
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: peliculas_db
      DB_USER: postgres
      DB_PASS: postgres
      # Opcional: si existe el secret, el coverage se sube a Codecov
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    defaults:
      run:
        working-directory: tp_parte3

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql
          coverage: pcov # driver que mide qué líneas ejecutan los tests
          tools: composer:v2

      - name: Instalar dependencias (PHPUnit)
        run: composer install --no-interaction --prefer-dist

      - name: Tests unitarios (con coverage)
        run: vendor/bin/phpunit --testsuite Unit --coverage-text --coverage-clover coverage-unit.xml

      - name: Tests de integración (con coverage, contra el PostgreSQL del servicio)
        run: vendor/bin/phpunit --testsuite Integration --coverage-text --coverage-clover coverage-integration.xml

      - name: Guardar reportes de coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: tp_parte3/coverage-*.xml

      - name: Subir coverage a Codecov (solo si existe el secret)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tp_parte3/coverage-unit.xml,tp_parte3/coverage-integration.xml
          fail_ci_if_error: false

  # 2) Calidad de código: sintaxis (bloqueante) y análisis estático (informativo)
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp_parte3
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2, phpstan

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Chequeo de sintaxis PHP
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Análisis estático con PHPStan (informativo, no frena el pipeline)
        continue-on-error: true
        run: phpstan analyse app --level=1 --no-progress --autoload-file=vendor/autoload.php

  # 3) Construye la imagen. En PRs solo se valida; en push a main (o tag) se publica en Docker Hub.
  #    No se publica nada si los tests fallan.
  docker:
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decidir si se publica
        id: check
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::notice::Pull request: se construye la imagen para validarla, pero no se publica."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::warning::Faltan los secrets DOCKERHUB_USERNAME y/o DOCKERHUB_TOKEN. Se construye la imagen pero no se publica."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        if: steps.check.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: rama / git tag / PR + un tag inmutable sha-<commit> (el que se despliega
      # y permite volver a cualquier commit) + latest en main.
      - name: Extraer metadata de Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/cartelera-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Render solo acepta imágenes linux/amd64
          push: ${{ steps.check.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deja a mano, en el resumen del run, el tag para usar en "Deploy Render".
      - name: Resumen
        if: steps.check.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${TAGS}"
            echo '```'
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then
              echo "Para desplegar: **Actions, Deploy Render**, tag \`sha-${GITHUB_SHA}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

