name: Deploy Render

# Deploy manual en Render: hace un GET al deploy hook guardado en el secret DEPLOY_URL.
# - Sin tag: Render vuelve a bajar la imagen configurada en el servicio (latest) y la
#   despliega. Es lo que hace el workflow de la cátedra.
# - Con tag (ej. sha-<commit>): le pide a Render ese tag exacto (sirve para volver atrás).
run-name: Deploy ${{ inputs.tag || 'imagen configurada en Render' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag opcional (ej. sha-<commit>). Vacío = redesplegar la imagen configurada en Render (latest)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: {}
    # Nunca dos deploys a la vez; si se lanzan dos seguidos, el segundo espera.
    concurrency:
      group: deploy-render
      cancel-in-progress: false

    steps:
      - name: Llamar al deploy hook de Render
        env:
          # Los secrets se enmascaran en los logs.
          HOOK: ${{ secrets.DEPLOY_URL }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ inputs.tag }}
        run: |
          : "${HOOK:?DEPLOY_URL vacío: cargá el deploy hook de Render como secret del repo}"
          URL="$HOOK"

          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "::error::Tag inválido: '$TAG'"
              exit 1
            fi
            : "${DH_USER:?DOCKERHUB_USERNAME vacío: cargalo como secret del repo}"
            IMG="docker.io/${DH_USER,,}/cartelera-api:${TAG}"
            ENCODED=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMG")
            # El hook ya trae ?key=..., por eso se agrega con & (o con ? si no tuviera).
            SEP='?'; case "$HOOK" in *\?*) SEP='&';; esac
            URL="${HOOK}${SEP}imgURL=${ENCODED}"
            echo "Imagen pedida: $IMG"
          else
            echo "Sin tag: Render vuelve a bajar la imagen configurada en el servicio."
          fi

          STATUS=$(curl -sS -o response.txt -w '%{http_code}' "$URL")
          echo "Status: $STATUS"
          cat response.txt; echo
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Render respondió $STATUS"
            exit 1
          fi
