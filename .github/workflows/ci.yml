name: CI Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1) Corre los tests de PHPUnit (unitarios + integración contra MySQL real)
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # config.php lee estas variables de entorno
      DB_HOST: 127.0.0.1
      DB_NAME: peliculas_db
      DB_USER: root
      DB_PASS: root

    defaults:
      run:
        working-directory: tp_parte3

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql
          tools: composer:v2

      - name: Instalar dependencias (PHPUnit)
        run: composer install --no-interaction --prefer-dist

      - name: Tests unitarios
        run: vendor/bin/phpunit --testsuite Unit

      - name: Tests de integración (MySQL del servicio)
        run: vendor/bin/phpunit --testsuite Integration

  # 2) Si los tests pasan en main, construye y sube la imagen a Docker Hub
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cartelera-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cartelera-api:${{ github.sha }}
